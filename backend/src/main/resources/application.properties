# =====================================================================
# MahaSetu Platform - Application Properties (Phase 1)
# =====================================================================

server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=mahasetu-interop-backend

# ---------------------------------------------------------------------
# Datasource Configuration (PostgreSQL / Auto-Fallback)
# ---------------------------------------------------------------------
# When PostgreSQL is active, configure DB_HOST=localhost (or standard postgres URL)
# Defaults to in-memory PostgreSQL compatibility mode for instant zero-dependency execution
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:mahasetu_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Connection Pool Settings
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.auto-commit=true

# ---------------------------------------------------------------------
# JPA & Hibernate Configurations
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------
# Actuator Management & Health Endpoints
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---------------------------------------------------------------------
# MahaSetu Auto-Seeder Configuration
# ---------------------------------------------------------------------
mahasetu.seeder.enabled=true
