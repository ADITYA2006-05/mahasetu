services:
  # 1. Backend Web Service (Java 21 Spring Boot)
  - type: web
    name: mahasetu-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/mahasetu-interop-backend-1.0.0-phase2.jar
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: JAVA_VERSION
        value: 21

  # 2. Frontend Static Site (React + Vite)
  - type: web
    name: mahasetu-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
